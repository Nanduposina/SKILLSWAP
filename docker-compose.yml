services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap -d skillswap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 5002
      DATABASE_URL: postgresql://skillswap:skillswap_dev@db:5432/skillswap
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5002:5002"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run dev"

  web:
    image: node:24-alpine
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm start"
    depends_on:
      - api

volumes:
  postgres-data:
